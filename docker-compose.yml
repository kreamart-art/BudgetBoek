# Self-hosted, all-in-one stack (alternatief voor Coolify+Vercel).
# Backend + Postgres + statische frontend + Caddy (automatische HTTPS).
# Kopieer .env.example → .env, vul de waarden, en draai:  docker compose up -d --build
#
# Op Coolify gebruik je dit niet: daar deploy je de backend via de Dockerfile en
# laat je Coolify de Postgres + HTTPS-proxy verzorgen.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      POSTGRES_DB: budgetboek
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budgetboek"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?zet JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?zet CORS_ORIGIN in .env}
      TRUST_PROXY: "1"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budgetboek
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?zet VITE_API_URL in .env}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend
      - frontend

volumes:
  dbdata:
  caddydata:
  caddyconfig:

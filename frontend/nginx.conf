server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: alle niet-bestaande paden naar index.html (de app heeft geen server-side routes).
  location / {
    try_files $uri /index.html;
  }

  # Service worker en manifest niet agressief cachen, zodat updates doorkomen.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # Gehashte build-assets mogen lang gecachet worden.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
